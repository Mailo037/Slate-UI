<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slate UI — Overlay template</title><link rel="stylesheet" href="../slate.css"><script src="../slate.js"></script><style>body{margin:0;min-width:280px}.overlay-stage{min-height:100dvh;display:flex;justify-content:center;padding:12px}.overlay{width:min(440px,100%);max-height:calc(100dvh - 24px);height:376px;display:flex;flex-direction:column;gap:12px;background:var(--sl-overlay);border-radius:20px;padding:16px;box-shadow:0 10px 28px #0007}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head strong{font-size:14px;font-weight:600}.transcript{min-height:48px;flex:1;overflow-y:auto;overflow-x:clip;background:var(--sl-surface);border-radius:12px;padding:16px;line-height:1.65;color:var(--sl-muted)}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--sl-line);padding-top:12px}.footer .sl-row{flex-wrap:nowrap}.sl-hint{margin:0}</style></head>
<body class="slate-ui"><div class="overlay-stage"><main class="overlay" aria-label="Dictation overlay template"><header class="head"><strong>Workspace</strong><a class="sl-btn icon" href="../index.html" aria-label="Return to the kit" data-sl-tooltip="Return to the kit"><svg class="sl-icon" data-sl-icon="close" aria-hidden="true"></svg></a></header><div class="head"><span class="sl-status" id="record-status">Ready</span><span class="sl-hint">UI preview</span></div><div class="transcript" data-sl-scroll-fade tabindex="0" role="region" aria-label="Transcript">Your words appear here. This template demonstrates the overlay layout; it does not record audio or connect to a speech model.</div><label class="sl-hint">Input level<progress class="sl-progress" value="0" max="100" id="meter" aria-label="Example input level">0%</progress></label><footer class="footer"><button class="sl-btn primary" id="record"><svg class="sl-icon" data-sl-icon="mic" aria-hidden="true"></svg><span>Start preview</span></button><button class="sl-btn ghost" data-sl-dialog="info">Info</button></footer></main></div><dialog class="sl-dialog" id="info" aria-labelledby="info-title"><h2 id="info-title">Compact overlay</h2><p>Use a host window around 460 × 400px. Connect recording, copy and window actions to your actual application APIs.</p><div class="sl-dialog-actions"><button class="sl-btn primary" data-sl-dialog-close autofocus>Got it</button></div></dialog><script>const dispose=SlateUI.init(document);let active=false;document.getElementById('record').addEventListener('click',()=>{active=!active;SlateUI.setIcon(document.querySelector('#record svg'),active?'stop':'mic');document.querySelector('#record span').textContent=active?'Stop preview':'Start preview';document.getElementById('record-status').textContent=active?'Listening (demo)':'Ready';document.getElementById('meter').value=active?34:0;});window.addEventListener('pagehide',dispose,{once:true});</script></body></html>
